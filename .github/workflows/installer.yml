name: Installer

# Builds the installer app on every push to main. Pushing a tag v* also
# publishes a GitHub Release with the .cia, so the FBI QR code
# (releases/latest/download/pretendo-bridge-installer.cia) points to it.

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    steps:
      - uses: actions/checkout@v4

      - name: Build the installer
        run: bash .github/scripts/build_installer.sh

      - uses: actions/upload-artifact@v4
        with:
          name: pretendo-bridge-installer
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pretendo-bridge-installer
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Pretendo Bridge Installer $GITHUB_REF_NAME" \
            --notes "Install with FBI: Remote Install > Scan QR Code (see README). Contains the bridge patch for Nintendo Badge Arcade EUR 1.3.1."
